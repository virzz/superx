name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: superx-linux-amd64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: superx-darwin-amd64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: superx-darwin-arm64
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.platform.target }}

      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1.0.7
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: "--locked --release"
          strip: true

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.platform.target }}/release/superx dist/
          tar -czf dist/${{ matrix.platform.artifact }}.tar.gz -C dist superx

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.artifact }}
          path: dist/${{ matrix.platform.artifact }}.tar.gz
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2.6.2
        with:
          generate_release_notes: true
          files: artifacts/**/*.tar.gz

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger homebrew-enyo update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh api repos/virzz/homebrew-enyo/dispatches \
            -f event_type=update-formula \
            -f 'client_payload[formula]=superx' \
            -f "client_payload[version]=${VERSION}"
